<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Generator</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        h1 {
            font-size: 40px;
            color: rgb(35, 214, 178);
        }

        button {
            background-color: rgb(18, 45, 221);
            color: rgb(242, 237, 237);
            font-size: 16px;
            padding: 11px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(252, 50, 201);
        }

        pre {
            font-family: monospace;
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <h1>ASCII Art Generator</h1>

    <form action="/ascii-art" method="POST">

        <label for="text">Enter your text:</label>
        <br>
        <textarea
            id="text"
            name="text"
            rows="8"
            cols="80"
            placeholder="Type something..."
            required>{{.Input}}</textarea>

        <br><br>

        <label for="banner">Choose a banner:</label>

        <select id="banner" name="banner">
            <option value="standard" {{if eq .Banner "standard"}}selected{{end}}>Standard</option>
            <option value="shadow" {{if eq .Banner "shadow"}}selected{{end}}>Shadow</option>
            <option value="thinkertoy" {{if eq .Banner "thinkertoy"}}selected{{end}}>Thinkertoy</option>
        </select>

        <br><br>

        <button type="submit">Generate ASCII Art</button>

    </form>

    {{if .Result}}
        <h2>Your ASCII Art:</h2>
        <pre id="ascii-box" class="ascii-box">{{.Result}}</pre>
    {{end}}

</body>
</html>
